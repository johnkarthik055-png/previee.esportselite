name: Deploy to Hostinger Preview

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Verify .htaccess in dist
        run: |
          if [ ! -f dist/.htaccess ]; then
            echo "MISSING - copying manually"
            cp public/.htaccess dist/.htaccess
          else
            echo "EXISTS"
            cat dist/.htaccess
          fi

      - name: Deploy to Hostinger via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: ./domains/esportselite.in/public_html/preview/
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
